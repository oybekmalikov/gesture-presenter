version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: okmk_postgres
    restart: always
    environment:
      POSTGRES_DB: okmk_seminar
      POSTGRES_USER: okmk_user
      POSTGRES_PASSWORD: okmk_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - okmk_network

  redis:
    image: redis:7-alpine
    container_name: okmk_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - okmk_network

volumes:
  pgdata:
  redisdata:

networks:
  okmk_network:
    driver: bridge
