version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: okmk_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-okmk_seminar}
      POSTGRES_USER: ${DB_USER:-okmk_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-okmk_prod_2026}
    ports:
      - "${DB_PORT_MAPPING:-5434:5432}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-okmk_user} -d ${DB_NAME:-okmk_seminar}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - okmk_network

  redis:
    image: redis:7-alpine
    container_name: okmk_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT_MAPPING:-6380:6379}"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - okmk_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: okmk_backend
    restart: always
    environment:
      - PORT=5050
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-okmk_seminar}
      - DB_USER=${DB_USER:-okmk_user}
      - DB_PASSWORD=${DB_PASSWORD:-okmk_prod_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-okmk_secret_jwt_key_prod_2026}
      - JWT_ACCESS_EXPIRES_IN=30m
      - JWT_REFRESH_EXPIRES_IN=7d
      - DEFAULT_SUPERADMIN_USERNAME=${DEFAULT_SUPERADMIN_USERNAME:-superadmin}
      - DEFAULT_SUPERADMIN_PASSWORD=${DEFAULT_SUPERADMIN_PASSWORD:-superadmin2026}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin2026}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - okmk_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: okmk_frontend
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - backend
    networks:
      - okmk_network

volumes:
  pgdata:
    name: okmk_pgdata
  redisdata:
    name: okmk_redisdata
  uploads_data:
    name: okmk_uploads_data

networks:
  okmk_network:
    name: okmk_network
    driver: bridge
