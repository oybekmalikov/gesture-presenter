version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: okmk_postgres
    restart: always
    environment:
      POSTGRES_DB: okmk_seminar
      POSTGRES_USER: okmk_user
      POSTGRES_PASSWORD: okmk_dev_2026
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - okmk_network

  redis:
    image: redis:7-alpine
    container_name: okmk_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    networks:
      - okmk_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: okmk_backend
    restart: always
    environment:
      - PORT=5050
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=okmk_seminar
      - DB_USER=okmk_user
      - DB_PASSWORD=okmk_dev_2026
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "5050:5050"
    depends_on:
      - postgres
      - redis
    networks:
      - okmk_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: okmk_frontend
    restart: always
    ports:
      - "4664:443"
      - "4665:80"
    depends_on:
      - backend
    networks:
      - okmk_network

volumes:
  pgdata:
  redisdata:

networks:
  okmk_network:
    driver: bridge
